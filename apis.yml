name: Casana
description: >-
  Casana (Casana Care) is a Rochester, New York digital-health company building
  passive, in-home remote patient monitoring hardware. Its flagship Smart Seat
  (formerly the Heart Seat) is a toilet-seat replacement that captures vital
  signs — heart rate, heart-rate variability, blood-oxygen (SpO2), respiration
  rate, blood-pressure insights, and sit-to-stand power — during normal
  bathroom use, with no wearables, no daily charging, and explicitly no camera
  or microphone. Readings sync to companion iOS, Android, and web apps for
  patients, families, and caregivers. The company operates in the digital
  health, remote patient monitoring, and connected medical-device space and is
  backed by General Catalyst and Kaiser Permanente. As of this profile Casana
  publishes a consumer product, companion apps, and legal/privacy pages, but no
  public developer program, API, or documentation surface.
